name: Generate Texture Manifest

on:
  push:
    paths:
      - 'assets/minecraft/textures/**'
      - '.github/workflows/generate-texture-manifest.yml'

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate manifest
        run: |
          python3 <<'PY'
          import hashlib
          import json
          import pathlib

          root = pathlib.Path("assets/minecraft/textures")

          files = {}

          if not root.exists():
              raise SystemExit("Texture directory does not exist: " + str(root))

          for path in sorted(root.rglob("*")):
              if not path.is_file():
                  continue

              data = path.read_bytes()

              digest = hashlib.sha256(data).hexdigest()[:16]

              files[path.as_posix()] = digest

          output = {
              "files": files
          }

          pathlib.Path("manifest.json").write_text(
              json.dumps(
                  output,
                  indent=2,
                  sort_keys=True
              ) + "\n",
              encoding="utf-8"
          )

          print("Generated manifest for", len(files), "files")
          PY

      - name: Commit manifest
        run: |
          if [ -z "$(git status --porcelain -- manifest.json)" ]; then
            echo "Manifest already current"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add manifest.json
          git commit -m "Update texture manifest"
          git push
