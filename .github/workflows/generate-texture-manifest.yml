name: update texture manifest

on:
  push:
    paths:
      - "assets/minecraft/textures/**"
      - ".github/workflows/generate-texture-manifest.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: make manifest
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("assets/minecraft/textures")
          files = {}

          for file in root.rglob("*"):
              if file.is_file():
                  files[file.as_posix()] = hashlib.sha256(file.read_bytes()).hexdigest()[:16]

          files = dict(sorted(files.items()))

          with open("manifest.json", "w", encoding="utf-8") as f:
              json.dump({"files": files}, f, indent=2)
              f.write("\n")

          print("textures:", len(files))
          PY

      - name: push it
        run: |
          git add manifest.json

          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "update texture manifest"
          git push
